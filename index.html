<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Roster</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="top">
    <h1 id="title">Roster</h1>
    <nav class="tabs" id="tabs">
      <button data-tab="roster" class="on">Roster</button>
      <button data-tab="staff">Staff</button>
      <button data-tab="shifts">Shifts</button>
      <button data-tab="requests">Requests</button>
      <button data-tab="settings">Settings</button>
    </nav>
  </header>

  <main>
    <section id="tab-roster" class="tab on">
      <div class="toolbar">
        <button id="btnGenerate" class="primary">Generate roster</button>
        <label class="chk"><input type="checkbox" id="keepLocks" checked> Keep my manual changes</label>
        <button id="btnClear">Clear</button>
        <span id="attempt" class="hint"></span>
        <span class="grow"></span>
        <label class="chk"><input type="checkbox" id="showCodes"> Show shift codes</label>
        <button id="btnExcel">Export to Excel</button>
        <button id="btnPrint">Print</button>
      </div>
      <div id="progress" class="progress" hidden><div id="progressBar"></div></div>
      <div id="issues"></div>
      <div id="roster"></div>
      <div id="legend" class="legend"></div>
    </section>

    <section id="tab-staff" class="tab"></section>
    <section id="tab-shifts" class="tab"></section>
    <section id="tab-requests" class="tab"></section>
    <section id="tab-settings" class="tab"></section>
  </main>

  <div id="pop" class="pop" hidden></div>
  <input type="file" id="importFile" accept=".json,application/json" hidden>

  <script src="js/engine.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
